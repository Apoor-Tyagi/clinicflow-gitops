repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: local
    hooks:
      - id: block-secret-manifests
        name: block secret manifests
        entry: Secret manifests must never be committed
        language: fail
        files: '\.secret\.ya?ml$'
