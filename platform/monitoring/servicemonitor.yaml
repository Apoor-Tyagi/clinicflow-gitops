apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clinicflow-api
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - clinicflow-dev
  selector:
    matchLabels:
      app: clinicflow-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
